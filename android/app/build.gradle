plugins {
    id 'com.android.application'
}

// version name = GAME_VERSION in js/game.js (one place to change)
def gameJs = file('../../js/game.js')
def gameVersion = (gameJs.exists() ? (gameJs.text =~ /GAME_VERSION = '([^']+)'/) : null)
def versionNameFromGame = (gameVersion && gameVersion.find()) ? gameVersion.group(1) : '1.0.1'

// release signing: the CI writes the keystore from the secrets and passes these properties (-P...)
def ksFile = project.findProperty('ksFile')
def ksPass = project.findProperty('ksPass')
def ksAlias = project.findProperty('ksAlias')

android {
    namespace 'ru.german71.ornamentsort'
    compileSdk 35

    defaultConfig {
        applicationId 'ru.german71.ornamentsort'
        minSdk 24
        targetSdk 35
        versionCode((project.findProperty('versionCode') ?: '1') as int)
        versionName versionNameFromGame
    }

    signingConfigs {
        if (ksFile) {
            release {
                storeFile file(ksFile)
                storePassword ksPass
                keyAlias ksAlias
                keyPassword ksPass
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (ksFile) signingConfig signingConfigs.release
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // the game files are already compressed audio / small text: keep mp3 uncompressed in the APK
    androidResources {
        noCompress 'mp3'
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.core:core:1.13.1'
}
