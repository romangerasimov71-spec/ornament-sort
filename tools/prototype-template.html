    var side = 8;
    if (W / H >= 1.3) {
      // landscape: the board uses the full height between the corner buttons
      var bb = ui.btnUndo.getBoundingClientRect();
      side = bb.right + 8;
      botT = H - Math.max(6, H - bb.bottom);
    }
    area.x = side; area.w = W - side * 2;
    area.y = topB + 4;
    area.h = Math.max(50, botT - chipSpace - area.y);
    ui.chip.style.top = (botT - chipSpace + 2) + 'px';
    renderBackground();
    initSnow();
    if (G) computeLayout();
    positionHand();
    drawScene(0);
  }

  function frame(ts) {
    requestAnimationFrame(frame);
    var tsec = ts / 1000;
    var dt = lastFrame ? Math.min(0.05, tsec - lastFrame) : 0.016;
    lastFrame = tsec;
    if (document.hidden) return;
    now += dt;
    updateSnow(dt);
    updateSparks(dt);
    drawScene(dt);
  }

  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function () { setTimeout(resize, 200); });
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  document.addEventListener('selectstart', function (e) { e.preventDefault(); });
  canvas.addEventListener('pointerdown', function (e) {
    var b = hitBox(e.clientX, e.clientY);
    if (b >= 0) tapBox(b);
    else if (G && G.selected >= 0) { G.selected = -1; updateHint(); }
  });
  ui.btnUndo.addEventListener('click', undo);
  ui.btnRestart.addEventListener('click', restart);
  ui.btnNext.addEventListener('click', nextLevel);

  function renderSettings() {
    ui.swMusic.setAttribute('aria-checked', String(settings.musicOn));
    ui.swSfx.setAttribute('aria-checked', String(settings.sfxOn));
    ui.volMusic.value = Math.round(settings.musicVol * 100);
    ui.volSfx.value = Math.round(settings.sfxVol * 100);
    ui.volMusic.disabled = !settings.musicOn;
    ui.volSfx.disabled = !settings.sfxOn;
  }
  function changed() { applyVolumes(); renderSettings(); saveSettings(); }
  ui.btnSettings.addEventListener('click', function () { SND.play('button'); renderSettings(); ui.settings.classList.remove('hidden'); });
  ui.btnCloseSettings.addEventListener('click', function () { SND.play('button'); ui.settings.classList.add('hidden'); });
  ui.settings.addEventListener('pointerdown', function (e) { if (e.target === ui.settings) ui.settings.classList.add('hidden'); });
  ui.swMusic.addEventListener('click', function () { settings.musicOn = !settings.musicOn; changed(); SND.play('button'); });
  ui.swSfx.addEventListener('click', function () { settings.sfxOn = !settings.sfxOn; changed(); SND.play('button'); });
  ui.volMusic.addEventListener('input', function () { settings.musicVol = ui.volMusic.value / 100; applyVolumes(); });
  ui.volSfx.addEventListener('input', function () { settings.sfxVol = ui.volSfx.value / 100; applyVolumes(); });
  ui.volMusic.addEventListener('change', changed);
  ui.volSfx.addEventListener('change', function () { changed(); SND.play('drop'); });
  renderSettings();

  // read-only hook for automated tests
  window.OSProto = {
    debug: function () {
      return { audio: { state: actx ? actx.state : 'none', music: !!musicSrc, loaded: Object.keys(buffers).length,
          played: sndStats.played, errors: sndStats.errors, last: sndStats.last, musicGain: musicGain ? musicGain.gain.value : null,
          sfxGain: sfxGain ? sfxGain.gain.value : null }, settings: settings, hand: ui.hand.classList.contains('hidden') ? null : handPoint(),
        level: G.index + 1, moves: G.moves, won: G.won, cap: G.cap, boxes: colorState(),
        rects: layout.boxes.map(function (B) { return { x: B.x, y: B.y, w: B.w, h: B.h }; }) };
    }
  };

  startLevel(0);
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
