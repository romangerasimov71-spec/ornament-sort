<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Новогодняя сортировка — прототип</title>
<!-- Built by tools/build-prototype.js from js/rules.js and js/game.js. Do not edit by hand. -->
<style>
:root { --btn: clamp(42px, min(12vw, 10.5vh), 60px); --gap: clamp(8px, 1.6vmin, 16px); }
* { box-sizing: border-box; }
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #0b1633; overscroll-behavior: none; }
body { position: fixed; inset: 0; color: #fff; font-family: "Trebuchet MS", "Segoe UI", Roboto, Arial, sans-serif;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; touch-action: none; }
canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.hidden { display: none !important; }
button { font-family: inherit; color: inherit; border: 0; margin: 0; cursor: pointer; touch-action: manipulation; }
svg { display: block; }
svg path, svg rect { fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.bar { position: absolute; left: 0; right: 0; display: flex; align-items: center; justify-content: space-between; gap: var(--gap);
  padding-left: max(var(--gap), env(safe-area-inset-left)); padding-right: max(var(--gap), env(safe-area-inset-right)); pointer-events: none; }
.bar > * { pointer-events: auto; }
#topbar { top: 0; padding-top: max(var(--gap), env(safe-area-inset-top)); }
#bottombar { bottom: 0; padding-bottom: max(var(--gap), env(safe-area-inset-bottom)); }
.icon-btn { flex: 0 0 auto; width: var(--btn); height: var(--btn); border-radius: 50%; display: flex; align-items: center; justify-content: center;
  background: radial-gradient(circle at 35% 30%, rgba(60,98,150,.95), rgba(16,34,70,.95));
  box-shadow: inset 0 0 0 2px rgba(255,255,255,.28), 0 3px 0 rgba(4,10,26,.55), 0 6px 14px rgba(0,0,0,.3); }
.icon-btn svg { width: 54%; height: 54%; }
.icon-btn:active, .btn:active { transform: translateY(2px) scale(.97); }
.icon-btn:disabled { filter: grayscale(1) brightness(.7); cursor: default; }
.spacer { width: var(--btn); flex: 0 0 auto; }
.level-info { flex: 1 1 auto; text-align: center; text-shadow: 0 2px 4px rgba(0,0,0,.5); pointer-events: none; }
#level-label { font-weight: 800; font-size: clamp(18px, min(5.4vw, 5vh), 30px); white-space: nowrap; }
#moves-label { font-size: clamp(13px, min(3.6vw, 3.2vh), 18px); opacity: .85; white-space: nowrap; }
#hint-chip { position: absolute; left: 50%; transform: translateX(-50%); max-width: calc(100% - 24px); padding: 6px 14px; border-radius: 16px;
  background: rgba(8,20,46,.78); box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.25); font-size: clamp(13px, min(3.6vw, 3.2vh), 17px);
  font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: none; }
#hand { position: absolute; width: 54px; height: 61px; margin-left: -16px; margin-top: -2px; pointer-events: none;
  animation: hand-tap 1.1s ease-in-out infinite; transition: left .35s ease, top .35s ease; }
#hand svg { width: 100%; height: 100%; filter: drop-shadow(0 4px 6px rgba(0,0,0,.45)); }
#hand svg path { fill: #fff; stroke: #2a3550; stroke-width: 3; }
#hand .ring { position: absolute; left: 16px; top: 2px; width: 0; height: 0; border-radius: 50%; animation: hand-ring 1.1s ease-out infinite; }
@keyframes hand-tap { 0%, 100% { transform: translate(6px, 14px); } 45%, 60% { transform: translate(0, 0) scale(.92); } }
@keyframes hand-ring { 0%, 40% { box-shadow: 0 0 0 0 rgba(255,220,120,.9); } 100% { box-shadow: 0 0 0 26px rgba(255,220,120,0); } }
.overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(5,12,30,.55); animation: fade .25s ease-out; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.card { position: relative; width: min(400px, 100%); padding: clamp(30px, 6vmin, 42px) 20px clamp(16px, 3.5vmin, 24px); border-radius: 24px; text-align: center; color: #3a2418;
  background: linear-gradient(#fffaf1, #f1e2c9); box-shadow: 0 0 0 4px #e9c46a, 0 0 0 7px #8a1b27, 0 18px 40px rgba(0,0,0,.5); animation: pop .35s cubic-bezier(.2,1.4,.4,1); }
@keyframes pop { from { transform: scale(.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.ribbon { position: absolute; left: 50%; top: -16px; transform: translateX(-50%); min-width: 64%; max-width: 94%; padding: 8px 20px; border-radius: 12px; white-space: nowrap;
  background: linear-gradient(#e7404c, #a91a27); box-shadow: inset 0 0 0 2px rgba(255,255,255,.3), 0 4px 0 #5e0c15; color: #fff; font-weight: 900; font-size: clamp(20px, min(5.6vw, 5.4vh), 28px); }
.card p { margin: 8px 0; font-weight: 700; font-size: clamp(15px, min(4.2vw, 4vh), 20px); }
.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 50px; margin-top: 8px; padding: 0 30px; border-radius: 26px;
  font-size: clamp(18px, min(4.8vw, 4.6vh), 24px); font-weight: 800; color: #fff; background: linear-gradient(#f2545f, #b81f2c);
  box-shadow: inset 0 0 0 2px rgba(255,255,255,.35), 0 4px 0 #6e0f19, 0 8px 18px rgba(0,0,0,.35); }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="topbar" class="bar">
  <div class="spacer"></div>
  <div class="level-info"><div id="level-label"></div><div id="moves-label"></div></div>
  <div class="spacer"></div>
</div>
<div id="bottombar" class="bar">
  <button id="btn-undo" class="icon-btn" type="button" aria-label="Отменить ход">
    <svg viewBox="0 0 24 24"><path d="M8.5 13.5L4 9l4.5-4.5"/><path d="M4.5 9H14a6 6 0 0 1 0 12h-3"/></svg>
  </button>
  <button id="btn-restart" class="icon-btn" type="button" aria-label="Заново">
    <svg viewBox="0 0 24 24"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3"/><path d="M19.8 4.2v4.6h-4.6"/></svg>
  </button>
</div>
<div id="hint-chip" class="hidden"></div>
<div id="hand" class="hidden">
  <svg viewBox="0 0 64 72"><path d="M24 6c0-3.3 2.7-6 6-6s6 2.7 6 6v22.5c1-1.6 2.7-2.6 4.7-2.6 2.6 0 4.7 1.8 5.3 4.2 1-1.1 2.4-1.8 4-1.8 3 0 5.4 2.4 5.4 5.4v1.6c.9-.6 2-1 3.1-1 3 0 5.5 2.4 5.5 5.5V48c0 13.3-10 24-23 24h-4.4c-7 0-13.4-3.6-17-9.6L4.4 46.6c-1.7-2.8-.9-6.5 1.9-8.3 2.6-1.7 6-1.2 8 1.1l9.7 10.7V6z"/></svg>
  <span class="ring"></span>
</div>
<div id="win" class="overlay hidden">
  <div class="card">
    <div class="ribbon" id="win-title"></div>
    <p id="win-text"></p>
    <button id="btn-next" class="btn" type="button"></button>
  </div>
</div>

<script type="application/json" id="levels">
/*LEVELS*/
</script>
<script>
/*RULES*/
</script>
<script>
(function () {
  'use strict';
  var R = window.OSRules;
  var LEVELS = JSON.parse(document.getElementById('levels').textContent);
  var SND = { play: function () {} };          // the prototype has no sound
  var canvas = document.getElementById('scene');
  var ctx = canvas.getContext('2d');
  var $ = function (id) { return document.getElementById(id); };
  var ui = {
    topbar: $('topbar'), bottombar: $('bottombar'), levelLabel: $('level-label'), movesLabel: $('moves-label'),
    btnUndo: $('btn-undo'), btnRestart: $('btn-restart'), chip: $('hint-chip'), hand: $('hand'),
    win: $('win'), winTitle: $('win-title'), winText: $('win-text'), btnNext: $('btn-next')
  };
  var W = 0, H = 0, DPR = 1;
  var area = { x: 0, y: 0, w: 0, h: 0 };
  var garlandY = 2, garlandSag = 30;
  var mode = 'play';
  var now = 0, lastFrame = 0;
  var G = null, nextOrnId = 1;
  var layout = { boxes: [], w: 0, d: 0 };
  var bgCanvas = document.createElement('canvas');
  var spriteCache = {};
  var snow = [], sparks = [];
  var keyboardMode = false;
  var handTarget = -1;

/*COLORS*/
/*HELPERS*/
/*DRAWING*/
/*LAYOUT*/
/*RENDERING*/

  // ---------------------------------------------------------------- prototype logic
  function colorState() {
    return G.boxes.map(function (b) { return b.map(function (o) { return o.c; }); });
  }

  function startLevel(index) {
    var data = LEVELS[index];
    G = {
      index: index, cap: data.c,
      boxes: data.b.map(function (box) {
        return box.map(function (c) { return { id: nextOrnId++, c: c, fly: null, land: -9, lift: 0, liftOff: 0 }; });
      }),
      history: [], moves: 0, selected: -1, cursor: 0, won: false, winAt: 0,
      shake: [], appear: [], doneAt: [], sparkedAt: [], tutorial: index === 0
    };
    G.boxes.forEach(function (b, i) { G.shake[i] = -9; G.appear[i] = -9; G.doneAt[i] = -9; });
    ui.win.classList.add('hidden');
    computeLayout();
    updateHud();
    updateHint();
  }

  function updateHud() {
    ui.levelLabel.textContent = 'Уровень ' + (G.index + 1) + ' из ' + LEVELS.length;
    ui.movesLabel.textContent = 'Ходы: ' + G.moves;
    ui.btnUndo.disabled = !G.history.length || G.won;
  }

  function tapBox(b) {
    if (!G || G.won) return;
    var cs = colorState();
    if (G.selected === -1) {
      if (!cs[b].length || R.isTubeDone(cs[b], G.cap)) { G.shake[b] = now; return; }
      G.selected = b;
      var box = G.boxes[b];
      var g = R.topGroup(cs[b]);
      var off = slotPos(b, box.length - 1).y - liftTargetY(b);
      for (var i = box.length - g.count; i < box.length; i++) box[i].liftOff = off;
    } else if (G.selected === b) {
      G.selected = -1;
    } else if (R.canMove(cs, G.cap, G.selected, b)) {
      doMove(G.selected, b, 0);
    } else {
      G.shake[b] = now;
      G.selected = -1;
    }
    updateHint();
  }

  function doMove(from, to, undoCount) {
    var src = G.boxes[from], dst = G.boxes[to];
    var count = undoCount || R.moveCount(colorState(), G.cap, from, to);
    for (var i = 0; i < count; i++) {
      var o = src.pop();
      var pos = ornamentPos(o, from, src.length);
      o.fly = { t0: now + i * 0.07, dur: 0.34, sx: pos.x, sy: pos.y, from: from };
      o.lift = 0; o.liftOff = 0;
      dst.push(o);
    }
    G.selected = -1;
    if (!undoCount) { G.history.push({ from: from, to: to, count: count }); G.moves++; }
    var cs = colorState();
    G.boxes.forEach(function (b, k) {
      var done = R.isTubeDone(cs[k], G.cap);
      if (done && G.doneAt[k] < 0) G.doneAt[k] = now + 0.07 * count + 0.3;
      if (!done) G.doneAt[k] = -9;
    });
    if (!undoCount && R.isSolved(cs, G.cap)) {
      G.won = true;
      G.winAt = now + 0.07 * count + 0.75;
      hideHand();
      ui.chip.classList.add('hidden');
    } else if (!undoCount && !R.usefulMoves(cs, G.cap).length) {
      setChip('Ходов нет — отмени ход или начни заново');
    }
    updateHud();
  }

  function undo() {
    if (!G || G.won || !G.history.length) return;
    var h = G.history.pop();
    doMove(h.to, h.from, h.count);
    updateHint();
  }

  function restart() { if (G) startLevel(G.index); }

  function showWinModal() {
    var last = G.index + 1 >= LEVELS.length;
    ui.winTitle.textContent = last ? 'Прототип пройден!' : 'Отлично!';
    ui.winText.textContent = last ? 'Все 5 уровней собраны. Спасибо за игру!' : 'Уровень ' + (G.index + 1) + ' пройден за ' + G.moves + ' ходов';
    ui.btnNext.textContent = last ? 'Сыграть снова' : 'Дальше';
    ui.win.classList.remove('hidden');
  }

  function nextLevel() {
    if (ui.win.classList.contains('hidden')) return;
    startLevel(G.index + 1 >= LEVELS.length ? 0 : G.index + 1);
  }

  function updateHint() {
    if (G.won) return;
    if (G.tutorial) {
      var sol = R.solveShortest(colorState(), G.cap, 5000);
      if (!sol || !sol.length) { hideHand(); return; }
      var m = sol[0];
      if (G.selected === m[0]) { pointHand(m[1]); setChip('Теперь нажми, куда его положить'); }
      else { pointHand(m[0]); setChip(G.history.length ? 'В каждой коробке — один цвет!' : 'Нажми на коробку — возьмёшь верхний шар'); }
      return;
    }
    hideHand();
    if (!G.history.length) setChip('Собери в каждой коробке один цвет');
    else ui.chip.classList.add('hidden');
  }

  function setChip(text) { ui.chip.textContent = text; ui.chip.classList.remove('hidden'); }
  function pointHand(b) { handTarget = b; ui.hand.classList.remove('hidden'); positionHand(); }
  function hideHand() { handTarget = -1; ui.hand.classList.add('hidden'); }
  function positionHand() {
    if (handTarget < 0 || !layout.boxes[handTarget]) return;
    var B = layout.boxes[handTarget];
    ui.hand.style.left = (B.x + B.w / 2) + 'px';
    ui.hand.style.top = (B.y + B.h * 0.42) + 'px';
  }

  function resize() {
    W = window.innerWidth; H = window.innerHeight;
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
    spriteCache = {};
    var topB = ui.topbar.getBoundingClientRect().bottom;
    var botT = ui.bottombar.getBoundingClientRect().top;
    garlandSag = clamp(Math.min(W, H) * 0.045, 12, 30);
    var chipSpace = clamp(H * 0.045, 26, 36);
    var side = 8;
    if (W / H >= 1.3) {
      // landscape: the board uses the full height between the corner buttons
      var bb = ui.btnUndo.getBoundingClientRect();
      side = bb.right + 8;
      botT = H - Math.max(6, H - bb.bottom);
    }
    area.x = side; area.w = W - side * 2;
    area.y = topB + 4;
    area.h = Math.max(50, botT - chipSpace - area.y);
    ui.chip.style.top = (botT - chipSpace + 2) + 'px';
    renderBackground();
    initSnow();
    if (G) computeLayout();
    positionHand();
    drawScene(0);
  }

  function frame(ts) {
    requestAnimationFrame(frame);
    var tsec = ts / 1000;
    var dt = lastFrame ? Math.min(0.05, tsec - lastFrame) : 0.016;
    lastFrame = tsec;
    if (document.hidden) return;
    now += dt;
    updateSnow(dt);
    updateSparks(dt);
    drawScene(dt);
  }

  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function () { setTimeout(resize, 200); });
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  document.addEventListener('selectstart', function (e) { e.preventDefault(); });
  canvas.addEventListener('pointerdown', function (e) {
    var b = hitBox(e.clientX, e.clientY);
    if (b >= 0) tapBox(b);
    else if (G && G.selected >= 0) { G.selected = -1; updateHint(); }
  });
  ui.btnUndo.addEventListener('click', undo);
  ui.btnRestart.addEventListener('click', restart);
  ui.btnNext.addEventListener('click', nextLevel);

  // read-only hook for automated tests
  window.OSProto = {
    debug: function () {
      return { level: G.index + 1, moves: G.moves, won: G.won, cap: G.cap, boxes: colorState(),
        rects: layout.boxes.map(function (B) { return { x: B.x, y: B.y, w: B.w, h: B.h }; }) };
    }
  };

  startLevel(0);
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
