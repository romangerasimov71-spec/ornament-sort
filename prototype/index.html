/*
 * Ornament Sort — game rules and a small solver.
 * Shared by the game (browser) and by the tools in /tools (Node).
 *
 * A level state is an array of boxes; every box is an array of color ids,
 * listed bottom -> top. `cap` is how many ornaments fit in one box.
 *
 * Move rule: the top group (all touching ornaments of the same color on top)
 * goes to another box when that box is empty or its top ornament has the same
 * color. As many ornaments move as fit into the free space.
 * Win: every box is empty or full with one color.
 */
(function (root, factory) {

    return state.map(function (t) { return t.slice(); });

  function topGroup(tube) {
    var n = tube.length;
    if (!n) return { color: -1, count: 0 };
    var c = tube[n - 1], k = 1;
    while (k < n && tube[n - 1 - k] === c) k++;
    return { color: c, count: k };
  }

  function canMove(state, cap, from, to) {
    if (from === to) return false;
    var a = state[from], b = state[to];
    if (!a || !b || !a.length) return false;

    if (!b.length) return true;
    return b[b.length - 1] === a[a.length - 1];

  function moveCount(state, cap, from, to) {

  // Mutates state. Returns how many ornaments moved (0 = illegal move).
  function applyMove(state, cap, from, to) {
    var k = moveCount(state, cap, from, to);
    for (var i = 0; i < k; i++) state[to].push(state[from].pop());
    return k;
  }

  function isTubeDone(tube, cap) {
    if (tube.length !== cap) return false;
    for (var i = 1; i < tube.length; i++) if (tube[i] !== tube[0]) return false;
    return true;
  }

    for (var i = 0; i < state.length; i++) {
      var t = state[i];

    return state.map(function (t) { return t.join(','); }).sort().join('|');

    return true;

  function usefulMoves(state, cap) {

      if (!a.length) continue;
      if (isTubeDone(a, cap)) continue;
      var g = topGroup(a);
      var mono = g.count === a.length;
      emptySeen = false;
      for (var to = 0; to < state.length; to++) {
        if (!canMove(state, cap, from, to)) continue;
        var b = state[to];
        if (!b.length) {
          if (mono) continue;          // moving a whole one-color box into an empty one changes nothing
          if (emptySeen) continue;     // all empty boxes are equivalent
          emptySeen = true;

        var k = Math.min(g.count, cap - b.length);
        var score = 0;
        if (b.length) score += 10;                     // stack onto the same color
        if (b.length && isMono(b)) score += 10;        // grow a clean box

    clone: clone,
    topGroup: topGroup,
    canMove: canMove,
    moveCount: moveCount,
    applyMove: applyMove,

    isSolved: isSolved,
    key: key,
    usefulMoves: usefulMoves,
    solve: solve,
    solveShortest: solveShortest
  };
});

  function drawOrnament(c, cx, cy, d, col) {

    c.fillRect(0, 0, W, H);

    // soft colored glows
    [[W * 0.15, H * 0.2, '#3be0c0', 0.12], [W * 0.85, H * 0.28, '#b06cff', 0.1], [W * 0.5, H * 0.75, '#ffcf7a', 0.12]].forEach(function (g) {
      var rg = c.createRadialGradient(g[0], g[1], 0, g[0], g[1], Math.max(W, H) * 0.5);
      rg.addColorStop(0, hexA(g[2], g[3]));
      rg.addColorStop(1, hexA(g[2], 0));
      c.fillStyle = rg;
      c.fillRect(0, 0, W, H);
    });

    // stars
    var rnd = mulberry(7);
    var n = Math.round(W * H / 6000);
    for (var i = 0; i < n; i++) {
      var sx = rnd() * W, sy = rnd() * H * 0.6, sr = rnd() * 1.3 + 0.3;
      c.fillStyle = 'rgba(255,255,255,' + (0.25 + rnd() * 0.5) + ')';
      c.beginPath(); c.arc(sx, sy, sr, 0, Math.PI * 2); c.fill();
    }

    // distant hills with fir trees
    var u = Math.min(W, H);
    function hill(baseY, amp, color, trees, treeColor, seed) {
      var r2 = mulberry(seed);
      c.fillStyle = color;
      c.beginPath();
      c.moveTo(0, H);
      for (var x = 0; x <= W + 10; x += 10) c.lineTo(x, baseY + Math.sin(x / W * 5 + seed) * amp + Math.sin(x / W * 13 + seed * 2) * amp * 0.3);
      c.lineTo(W, H);
      c.closePath();
      c.fill();
      for (var k = 0; k < trees; k++) {
        var tx = r2() * W;
        var ty = baseY + Math.sin(tx / W * 5 + seed) * amp + Math.sin(tx / W * 13 + seed * 2) * amp * 0.3 + 2;
        var th = u * (0.07 + r2() * 0.07);
        drawFir(c, tx, ty, th, treeColor);
      }
    }
    hill(H * 0.74, H * 0.025, '#21507c', Math.round(W / 70), '#173e63', 3);
    hill(H * 0.82, H * 0.03, '#d5e4f3', Math.round(W / 110), '#1c4a52', 9);
    // front snow
    var sg = c.createLinearGradient(0, H * 0.88, 0, H);
    sg.addColorStop(0, '#f2f8ff'); sg.addColorStop(1, '#bcd3ea');
    c.fillStyle = sg;
    c.beginPath(); c.moveTo(0, H);
    for (var x = 0; x <= W + 10; x += 10) c.lineTo(x, H * 0.9 + Math.sin(x / W * 4 + 1) * H * 0.015);
    c.lineTo(W, H); c.closePath(); c.fill();

    // vignette
    var vg = c.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.75);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(0,0,20,.35)');
    c.fillStyle = vg;
    c.fillRect(0, 0, W, H);
  }

  function drawFir(c, x, y, h, color) {
    c.fillStyle = color;
    var tiers = 3;
    for (var i = 0; i < tiers; i++) {
      var ty = y - h * (i / tiers) * 0.75;
      var tw = h * 0.42 * (1 - i * 0.22);
      c.beginPath();
      c.moveTo(x - tw, ty);
      c.quadraticCurveTo(x, ty + h * 0.06, x + tw, ty);
      c.lineTo(x, ty - h * 0.5);
      c.closePath();
      c.fill();
    }
    c.fillStyle = 'rgba(240,248,255,.55)';
    for (i = 0; i < tiers; i++) {
      ty = y - h * (i / tiers) * 0.75 - h * 0.5 + h * 0.02;
      c.beginPath(); c.moveTo(x, ty); c.lineTo(x - h * 0.06, ty + h * 0.08); c.lineTo(x + h * 0.06, ty + h * 0.08); c.closePath(); c.fill();
    }
  }

  // ================================================================ garland
  function garlandPoints() {
    var swags = Math.max(2, Math.round(W / 300));
    var seg = W / swags;
    var pts = [];
    for (var s = 0; s < swags; s++) {
      for (var i = 0; i <= 24; i++) {
        var f = i / 24;
        pts.push({ x: s * seg + f * seg, y: garlandY + Math.sin(f * Math.PI) * garlandSag, s: s, f: f });
      }
    }
    return { pts: pts, swags: swags, seg: seg };
  }

  function drawGarland(c) {
    var gp = garlandPoints();
    var pts = gp.pts;
    // fir garland: thick green rope with needle texture
    c.lineCap = 'round';
    c.lineJoin = 'round';
    for (var s = 0; s < gp.swags; s++) {
      c.beginPath();
      for (var i = 0; i <= 24; i++) {
        var p = pts[s * 25 + i];
        if (i) c.lineTo(p.x, p.y); else c.moveTo(p.x, p.y);
      }
      c.strokeStyle = '#0f4a2a'; c.lineWidth = 12; c.stroke();
      c.strokeStyle = '#1f7a43'; c.lineWidth = 8; c.setLineDash([3, 4]); c.stroke();
      c.strokeStyle = '#2f9a58'; c.lineWidth = 4; c.setLineDash([2, 6]); c.stroke();
      c.setLineDash([]);
    }
    // bulbs
    var spacing = 34, idx = 0;
    for (s = 0; s < gp.swags; s++) {
      var count = Math.max(4, Math.round(gp.seg / spacing));
      for (var k = 1; k < count; k++) {
        var f = k / count;
        var bx = s * gp.seg + f * gp.seg;
        var by = garlandY + Math.sin(f * Math.PI) * garlandSag + 6;
        var col = LIGHT_COLORS[idx % LIGHT_COLORS.length];
        var on = 0.55 + 0.45 * Math.sin(now * 2.4 + idx * 1.7);
        var glow = c.createRadialGradient(bx, by + 4, 0, bx, by + 4, 18);
        glow.addColorStop(0, hexA(col, 0.55 * on));
        glow.addColorStop(1, hexA(col, 0));
        c.fillStyle = glow;
        c.fillRect(bx - 18, by - 14, 36, 36);
        c.fillStyle = '#3c3c3c';
        c.fillRect(bx - 2.5, by - 3, 5, 4);
        c.fillStyle = col;
        c.globalAlpha = 0.55 + 0.45 * on;
        c.beginPath(); c.ellipse(bx, by + 5, 4, 6, 0, 0, Math.PI * 2); c.fill();
        c.globalAlpha = 1;
        c.fillStyle = 'rgba(255,255,255,.7)';
        c.beginPath(); c.arc(bx - 1.3, by + 3, 1.3, 0, Math.PI * 2); c.fill();
        idx++;
      }
    }
  }

  // ================================================================ snow and sparkles
  function initSnow() {
    var n = clamp(Math.round(W * H / 9000), 40, 170);
    snow = [];
    for (var i = 0; i < n; i++) snow.push(newFlake(true));
  }
  function newFlake(anyY) {
    var z = Math.random();
    return {
      x: Math.random() * W,
      y: anyY ? Math.random() * H : -5,
      r: 0.8 + z * 2.4,
      v: 18 + z * 42,
      ph: Math.random() * 6.28,
      a: 0.35 + z * 0.55
    };
  }
  function updateSnow(dt) {
    for (var i = 0; i < snow.length; i++) {
      var f = snow[i];
      f.y += f.v * dt;
      f.x += Math.sin(now * 0.8 + f.ph) * 12 * dt;
      if (f.y > H + 5) snow[i] = newFlake(false);
      if (f.x < -5) f.x = W + 5; else if (f.x > W + 5) f.x = -5;
    }
  }
  function drawSnow(c, front) {
    c.fillStyle = '#fff';
    for (var i = 0; i < snow.length; i++) {
      var f = snow[i];
      if ((f.r > 2.6) !== front) continue;
      c.globalAlpha = f.a;
      c.beginPath(); c.arc(f.x, f.y, f.r, 0, Math.PI * 2); c.fill();
    }
    c.globalAlpha = 1;
  }

  function burst(x, y, n, spread, colors) {
    for (var i = 0; i < n; i++) {
      var a = Math.random() * Math.PI * 2;
      var sp = spread * (0.3 + Math.random() * 0.7);
      sparks.push({
        x: x, y: y,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - spread * 0.4,
        life: 0, max: 0.7 + Math.random() * 0.6,
        size: 3 + Math.random() * 5,
        rot: Math.random() * 3,
        col: colors[i % colors.length]
      });
    }
  }
  function updateSparks(dt) {
    for (var i = sparks.length - 1; i >= 0; i--) {
      var p = sparks[i];
      p.life += dt;
      if (p.life >= p.max) { sparks.splice(i, 1); continue; }
      p.vy += 260 * dt;
      p.vx *= 0.985;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.rot += dt * 4;
    }
  }
  function drawSparks(c) {
    for (var i = 0; i < sparks.length; i++) {
      var p = sparks[i];
      var k = 1 - p.life / p.max;
      c.globalAlpha = Math.min(1, k * 1.6);
      c.fillStyle = p.col;
      var s = p.size * (0.5 + k * 0.5);
      c.beginPath();
      for (var j = 0; j < 8; j++) {
        var a = p.rot + j * Math.PI / 4;
        var rr2 = j % 2 ? s * 0.28 : s;
        c.lineTo(p.x + Math.cos(a) * rr2, p.y + Math.sin(a) * rr2);
      }
      c.closePath();
      c.fill();
    }
    c.globalAlpha = 1;
  }


  function computeLayout() {
    var n = G.boxes.length, cap = G.cap;
    var hRatio = 0.46 + 0.77 * cap;
    var liftR = 0.95, gapR = 0.3, rowGapR = 0.12;
    var best = null;
    for (var rows = 1; rows <= 4; rows++) {
      var k = Math.ceil(n / rows);
      if (rows > 1 && Math.ceil(n / (rows - 1)) === k) continue;
      var wW = area.w / (k + (k - 1) * gapR);
      var wH = area.h / (rows * (hRatio + liftR) + (rows - 1) * rowGapR);
      var w = Math.min(wW, wH, 128, area.w / (k * 1.3 + 0.4));
      if (!best || w > best.w + 0.5) best = { rows: rows, k: k, w: w };
    }
    var w = Math.floor(best.w);
    var bh = w * hRatio;
    var rowsCount = best.rows;
    // balanced rows: e.g. 11 boxes -> 6 + 5
    var perRow = [];
    var left = n;
    for (var r = 0; r < rowsCount; r++) {
      var c = Math.ceil(left / (rowsCount - r));
      perRow.push(c);
      left -= c;
    }
    var blockH = rowsCount * (bh + w * liftR) + (rowsCount - 1) * w * rowGapR;
    var y0 = area.y + (area.h - blockH) / 2;
    var gap = w * gapR;
    // spread a bit wider when there is room
    var maxRow = Math.max.apply(null, perRow);
    var free = area.w - (maxRow * w + (maxRow - 1) * gap);
    if (free > 0) gap = Math.min(gap + free / Math.max(1, maxRow + 1), w * 0.75);
    var boxes = [];
    var idx = 0;
    for (r = 0; r < rowsCount; r++) {
      var cnt = perRow[r];
      var rowW = cnt * w + (cnt - 1) * gap;
      var x0 = area.x + (area.w - rowW) / 2;
      var by = y0 + r * (bh + w * liftR + w * rowGapR) + w * liftR;
      for (var i = 0; i < cnt; i++) {
        boxes.push({ x: x0 + i * (w + gap), y: by, w: w, h: bh, row: r, col: i, gap: gap });
        idx++;
      }
    }
    layout.boxes = boxes;
    layout.w = w;
    layout.geom = boxGeom(w, cap);
    layout.d = layout.geom.d;
    layout.perRow = perRow;
  }

  function slotPos(b, i) {
    var B = layout.boxes[b];
    return { x: B.x + B.w / 2, y: B.y + layout.geom.slotY(i) };
  }

  function liftTargetY(b) {
    var B = layout.boxes[b];
    return B.y - layout.d * 0.55;
  }

  function hitBox(px, py) {
    for (var i = 0; i < layout.boxes.length; i++) {
      var B = layout.boxes[i];
      var mx = B.gap / 2;
      if (px >= B.x - mx && px <= B.x + B.w + mx && py >= B.y - B.w * 0.95 && py <= B.y + B.h + B.w * 0.1) return i;
    }
    return -1;
  }


  // ================================================================ rendering
  function ornamentPos(o, b, i) {
    var home = slotPos(b, i);
    var x = home.x, y = home.y - o.liftOff * o.lift;
    if (o.fly) {
      var f = o.fly;
      var k = (now - f.t0) / f.dur;
      if (k <= 0) {
        x = f.sx; y = f.sy;
      } else if (k < 1) {
        var e = easeInOut(k);
        var topY = Math.min(f.sy, liftTargetY(b), liftTargetY(f.from)) - layout.d * 0.15;
        // cubic Bezier: up from the source, across, down into the slot
        var p1x = f.sx, p1y = topY, p2x = home.x, p2y = topY;
        var u = 1 - e;
        x = u * u * u * f.sx + 3 * u * u * e * p1x + 3 * u * e * e * p2x + e * e * e * home.x;
        y = u * u * u * f.sy + 3 * u * u * e * p1y + 3 * u * e * e * p2y + e * e * e * home.y;
      }
    }
    return { x: x, y: y };
  }

  function drawScene(dt) {
    var c = ctx;
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.drawImage(bgCanvas, 0, 0);
    c.setTransform(DPR, 0, 0, DPR, 0, 0);
    drawSnow(c, false);
    if (mode === 'title') drawTitleDecor(c);
    drawGarland(c);
    if (mode === 'play' && G) drawBoard(c, dt);
    drawSparks(c);
    drawSnow(c, true);
  }

  function drawTitleDecor(c) {
    var u = Math.min(W, H);
    var gp = garlandPoints();
    var picks = [0.18, 0.5, 0.82];
    var cols = [0, 3, 2];
    var d = clamp(u * 0.13, 44, 120);
    picks.forEach(function (fx, i) {
      var x = W * fx;
      var s = Math.floor(x / gp.seg), f = (x - s * gp.seg) / gp.seg;
      var y0 = garlandY + Math.sin(f * Math.PI) * garlandSag + 4;
      var len = H * (W < H ? [0.2, 0.3, 0.16][i] : [0.1, 0.16, 0.08][i]) + d * 0.2;
      var ang = Math.sin(now * 1.3 + i * 1.9) * 0.08;
      var ox = x + Math.sin(ang) * len, oy = y0 + Math.cos(ang) * len;
      c.strokeStyle = 'rgba(255,230,160,.8)';
      c.lineWidth = 1.5;
      c.beginPath(); c.moveTo(x, y0); c.lineTo(ox, oy - d * 0.6); c.stroke();
      var spr = ornamentSprite(cols[i], d);
      c.save();
      c.translate(ox, oy);
      c.rotate(-ang);
      c.drawImage(spr, -spr.ox, -spr.oy + d * 0.0, spr.cssSize, spr.cssSize);
      c.restore();
    });
  }

  function drawBoard(c, dt) {
    var boxes = layout.boxes;
    var w = layout.w;
    var spr = boxSprite(w, layout.geom.h, G.cap);
    var k;
    // boxes
    for (var b = 0; b < G.boxes.length; b++) {
      var B = boxes[b];
      if (!B) continue;
      var sx = 0;
      var st = now - G.shake[b];
      if (st < 0.4) sx = Math.sin(st * 45) * w * 0.07 * (1 - st / 0.4);
      var sc = 1;
      var at = now - G.appear[b];
      if (at < 0.5) sc = ease(clamp(at / 0.5, 0, 1)) * (1 + 0.15 * Math.sin(clamp(at / 0.5, 0, 1) * Math.PI));
      B.sx = sx;
      c.save();
      c.translate(B.x + B.w / 2 + sx, B.y + B.h);
      c.scale(sc, sc);
      c.translate(-B.w / 2, -B.h);
      var done = G.doneAt[b] > 0 && now >= G.doneAt[b];
      if (G.selected === b || done) {
        c.save();
        c.shadowColor = done ? 'rgba(255,215,90,.95)' : 'rgba(255,240,170,.95)';
        c.shadowBlur = done ? 22 + 6 * Math.sin(now * 4) : 18;
        c.fillStyle = done ? 'rgba(255,200,80,.9)' : 'rgba(255,245,200,.9)';
        rr(c, 0, 0, B.w, B.h, B.w * 0.2);
        c.fill();
        c.restore();
      }
      c.drawImage(spr, -spr.pad, -spr.pad, spr.width / DPR, spr.height / DPR);
      if (keyboardMode && G.cursor === b) {
        c.save();
        c.strokeStyle = '#fff';
        c.lineWidth = 3;
        c.setLineDash([7, 5]);
        c.lineDashOffset = -now * 20;
        rr(c, -5, -B.w * 0.12, B.w + 10, B.h + B.w * 0.12 + 5, B.w * 0.24);
        c.stroke();
        c.restore();
      }
      c.restore();
    }

    // ornaments (resting first, flying ones on top)
    var flying = [];
    var lerp = 1 - Math.exp(-dt * 16);
    for (b = 0; b < G.boxes.length; b++) {
      var box = G.boxes[b];
      if (!boxes[b]) continue;
      var group = G.selected === b ? R.topGroup(colorState()[b]).count : 0;
      for (var i = 0; i < box.length; i++) {
        var o = box[i];
        var target = (G.selected === b && i >= box.length - group) ? 1 : 0;
        o.lift += (target - o.lift) * lerp;
        if (o.fly && now >= o.fly.t0 + o.fly.dur) {
          o.fly = null;
          o.land = now;
        }
        if (o.fly && now >= o.fly.t0) { flying.push([o, b, i]); continue; }
        drawOrn(c, o, b, i);
      }
    }
    for (k = 0; k < flying.length; k++) drawOrn(c, flying[k][0], flying[k][1], flying[k][2]);

    // bows on finished boxes
    for (b = 0; b < G.boxes.length; b++) {
      if (!(G.doneAt[b] > 0) || now < G.doneAt[b]) continue;
      var B2 = boxes[b];
      var bt = now - G.doneAt[b];
      if (G.sparkedAt[b] !== G.doneAt[b]) {
        G.sparkedAt[b] = G.doneAt[b];
        burst(B2.x + B2.w / 2, B2.y + B2.w * 0.1, 22, 240, ['#fff6c2', '#ffd34d', '#ffffff', COLORS[G.boxes[b][0].c].light]);
        SND.play('complete');
      }
      var s = w * 0.62 * (bt < 0.4 ? ease(bt / 0.4) * (1 + 0.25 * Math.sin(bt / 0.4 * Math.PI)) : 1);
      drawBow(c, B2.x + B2.w / 2 + (B2.sx || 0), B2.y - w * 0.04, s);
    }

    // win: celebrate, then show the result card
    if (G.won && G.winAt && now >= G.winAt) {
      G.winAt = 0;
      SND.play('win');
      for (b = 0; b < boxes.length; b++) {
        if (G.boxes[b].length) burst(boxes[b].x + boxes[b].w / 2, boxes[b].y + boxes[b].h * 0.4, 14, 300, ['#ffd34d', '#ffffff', '#ff6b7a', '#7dffb0']);
      }
      setTimeout(showWinModal, 900);
    }
  }

  function drawOrn(c, o, b, i) {
    var p = ornamentPos(o, b, i);
    var d = layout.d;
    var spr = ornamentSprite(o.c, d);
    var lt = now - o.land;
    var sxs = 1, sys = 1, dy = 0;
    if (lt < 0.45) {
      var k = lt / 0.45;
      var wob = Math.sin(k * Math.PI * 3) * (1 - k) * 0.16;
      sxs = 1 + wob; sys = 1 - wob;
      dy = d * wob * 0.3;
    }
    var bx = layout.boxes[b];
    var x = p.x + (o.fly ? 0 : (bx.sx || 0));
    if (sxs !== 1) {
      c.save();
      c.translate(x, p.y + d / 2 + dy);
      c.scale(sxs, sys);
      c.drawImage(spr, -spr.ox, -spr.oy - d / 2, spr.cssSize, spr.cssSize);
      c.restore();
    } else {
      c.drawImage(spr, x - spr.ox, p.y - spr.oy, spr.cssSize, spr.cssSize);
    }
  }



  // ---------------------------------------------------------------- prototype logic
  function colorState() {
    return G.boxes.map(function (b) { return b.map(function (o) { return o.c; }); });
  }

  function startLevel(index) {
    var data = LEVELS[index];
    if (progress.last !== index) { progress.last = index; saveProgress(); }
    G = {
      index: index, cap: data.c,
      boxes: data.b.map(function (box) {
        return box.map(function (c) { return { id: nextOrnId++, c: c, fly: null, land: -9, lift: 0, liftOff: 0 }; });
      }),
      history: [], moves: 0, selected: -1, cursor: 0, won: false, winAt: 0,
      shake: [], appear: [], doneAt: [], sparkedAt: [], tutorial: index === 0
    };
    G.boxes.forEach(function (b, i) { G.shake[i] = -9; G.appear[i] = -9; G.doneAt[i] = -9; });
    ui.win.classList.add('hidden');
    computeLayout();
    updateHud();
    updateHint();
  }

  function updateHud() {
    ui.levelLabel.textContent = 'Уровень ' + (G.index + 1) + ' из ' + LEVELS.length;
    ui.movesLabel.textContent = 'Ходы: ' + G.moves;
    ui.btnUndo.disabled = !G.history.length || G.won;
  }

  function tapBox(b) {
    if (!G || G.won) return;
    var cs = colorState();
    if (G.selected === -1) {
      if (!cs[b].length || R.isTubeDone(cs[b], G.cap)) { G.shake[b] = now; SND.play('wrong'); return; }
      G.selected = b;
      SND.play('pick', 0.95 + Math.random() * 0.1);
      var box = G.boxes[b];
      var g = R.topGroup(cs[b]);
      var off = slotPos(b, box.length - 1).y - liftTargetY(b);
      for (var i = box.length - g.count; i < box.length; i++) box[i].liftOff = off;
    } else if (G.selected === b) {
      G.selected = -1;
      SND.play('drop', 1.1);
    } else if (R.canMove(cs, G.cap, G.selected, b)) {
      doMove(G.selected, b, 0);
    } else {
      G.shake[b] = now;
      G.selected = -1;
      SND.play('wrong');
    }
    updateHint();
  }

  function doMove(from, to, undoCount) {
    var src = G.boxes[from], dst = G.boxes[to];
    var count = undoCount || R.moveCount(colorState(), G.cap, from, to);
    for (var i = 0; i < count; i++) {
      var o = src.pop();
      var pos = ornamentPos(o, from, src.length);
      o.fly = { t0: now + i * 0.07, dur: 0.34, sx: pos.x, sy: pos.y, from: from };
      o.lift = 0; o.liftOff = 0;
      dst.push(o);
    }
    G.selected = -1;
    SND.play('drop', 0.95 + Math.random() * 0.1);
    if (!undoCount) { G.history.push({ from: from, to: to, count: count }); G.moves++; }
    var cs = colorState();
    G.boxes.forEach(function (b, k) {
      var done = R.isTubeDone(cs[k], G.cap);
      if (done && G.doneAt[k] < 0) G.doneAt[k] = now + 0.07 * count + 0.3;
      if (!done) G.doneAt[k] = -9;
    });
    if (!undoCount && R.isSolved(cs, G.cap)) {
      G.won = true;
      progress.passed[G.index] = true;
      progress.last = Math.min(G.index + 1, LEVELS.length - 1);
      saveProgress();
      G.winAt = now + 0.07 * count + 0.75;
      hideHand();
      ui.chip.classList.add('hidden');
    } else if (!undoCount && !R.usefulMoves(cs, G.cap).length) {
      setChip('Ходов нет — отмени ход или начни заново');
    }
    updateHud();
  }

  function undo() {
    if (!G || G.won || !G.history.length) return;
    var h = G.history.pop();
    SND.play('button');
    doMove(h.to, h.from, h.count);
    updateHint();
  }

  function restart() { if (G) { SND.play('button'); startLevel(G.index); } }

  function showWinModal() {
    var last = G.index + 1 >= LEVELS.length;
    ui.winTitle.textContent = last ? 'Прототип пройден!' : 'Отлично!';
    ui.winText.textContent = last ? 'Все 5 уровней собраны. Спасибо за игру!' : 'Уровень ' + (G.index + 1) + ' пройден за ' + G.moves + ' ходов';
    ui.btnNext.textContent = last ? 'Сыграть снова' : 'Дальше';
    ui.btnPick.classList.toggle('hidden', !last);
    ui.win.classList.remove('hidden');
  }

  function nextLevel() {
    if (ui.win.classList.contains('hidden')) return;
    SND.play('button');
    startLevel(G.index + 1 >= LEVELS.length ? 0 : G.index + 1);
  }

  function updateHint() {
    if (G.won) return;
    if (G.tutorial) {
      var sol = R.solveShortest(colorState(), G.cap, 5000);
      if (!sol || !sol.length) { hideHand(); return; }
      var m = sol[0];
      if (G.selected === m[0]) { pointHand(m[1], G.boxes[m[1]].length); setChip('Теперь нажми, куда его положить'); }
      else { pointHand(m[0], G.boxes[m[0]].length - 1); setChip(G.history.length ? 'В каждой коробке — один цвет!' : 'Нажми на коробку — возьмёшь верхний шар'); }
      return;
    }
    hideHand();
    if (!G.history.length) setChip('Собери в каждой коробке один цвет');
    else ui.chip.classList.add('hidden');
  }

  function setChip(text) { ui.chip.textContent = text; ui.chip.classList.remove('hidden'); }
  // The fingertip points at slot `slot` of box `b`: the top ornament to take,
  // or the free place where the ornament will land.
  var handSlot = 0;
  function pointHand(b, slot) { handTarget = b; handSlot = slot; ui.hand.classList.remove('hidden'); positionHand(); }
  function hideHand() { handTarget = -1; ui.hand.classList.add('hidden'); }
  function handPoint() {
    if (handTarget < 0 || !layout.boxes[handTarget]) return null;
    return slotPos(handTarget, handSlot);
  }
  function positionHand() {
    var p = handPoint();
    if (!p) return;
    ui.hand.style.left = p.x + 'px';
    ui.hand.style.top = p.y + 'px';
  }

  function resize() {
    W = window.innerWidth; H = window.innerHeight;
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
    spriteCache = {};
    var topB = ui.topbar.getBoundingClientRect().bottom;
    var botT = ui.bottombar.getBoundingClientRect().top;
    garlandSag = clamp(Math.min(W, H) * 0.045, 12, 30);
    var chipSpace = clamp(H * 0.045, 26, 36);
    var side = 8;
    if (W / H >= 1.3) {
      // landscape: the board uses the full height between the corner buttons
      var bb = ui.btnUndo.getBoundingClientRect();
      side = bb.right + 8;
      botT = H - Math.max(6, H - bb.bottom);
    }
    area.x = side; area.w = W - side * 2;
    area.y = topB + 4;
    area.h = Math.max(50, botT - chipSpace - area.y);
    ui.chip.style.top = (botT - chipSpace + 2) + 'px';
    renderBackground();
    initSnow();
    if (G) computeLayout();
    positionHand();
    drawScene(0);
  }

  function frame(ts) {
    requestAnimationFrame(frame);
    var tsec = ts / 1000;
    var dt = lastFrame ? Math.min(0.05, tsec - lastFrame) : 0.016;
    lastFrame = tsec;
    if (document.hidden) return;
    now += dt;
    updateSnow(dt);
    updateSparks(dt);
    drawScene(dt);
  }

  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function () { setTimeout(resize, 200); });
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  document.addEventListener('selectstart', function (e) { e.preventDefault(); });
  canvas.addEventListener('pointerdown', function (e) {
    var b = hitBox(e.clientX, e.clientY);
    if (b >= 0) tapBox(b);
    else if (G && G.selected >= 0) { G.selected = -1; updateHint(); }
  });
  ui.btnUndo.addEventListener('click', undo);
  ui.btnRestart.addEventListener('click', restart);
  ui.btnNext.addEventListener('click', nextLevel);

  var CHECK = '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  var LOCK = '<svg viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/></svg>';
  function openLevels() {
    SND.play('button');
    ui.levelGrid.innerHTML = '';
    LEVELS.forEach(function (lv, i) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'lv';
      b.setAttribute('data-level', String(i));
      if (!isOpen(i)) { b.classList.add('locked'); b.innerHTML = LOCK; b.setAttribute('aria-label', 'Уровень ' + (i + 1) + ' закрыт'); }
      else {
        if (G && i === G.index) b.classList.add('current');
        else if (progress.passed[i]) b.classList.add('passed');
        b.innerHTML = '<span>' + (i + 1) + '</span>' + (progress.passed[i] ? CHECK : '');
        b.setAttribute('aria-label', 'Уровень ' + (i + 1));
      }
      b.addEventListener('click', function () {
        if (!isOpen(i)) { SND.play('wrong'); return; }
        ui.levels.classList.add('hidden');
        SND.play('button');
        startLevel(i);
      });
      ui.levelGrid.appendChild(b);
    });
    ui.win.classList.add('hidden');
    ui.levels.classList.remove('hidden');
  }
  function closeLevels() {
    SND.play('button');
    ui.levels.classList.add('hidden');
    // closing the list after the last level should not leave an empty finished board
    if (G && G.won) startLevel(G.index + 1 >= LEVELS.length ? 0 : G.index + 1);
  }
  ui.btnLevels.addEventListener('click', openLevels);
  ui.levelInfo.addEventListener('click', openLevels);
  ui.btnPick.addEventListener('click', openLevels);
  ui.btnCloseLevels.addEventListener('click', closeLevels);
  ui.levels.addEventListener('pointerdown', function (e) { if (e.target === ui.levels) closeLevels(); });

  function renderSettings() {
    ui.swMusic.setAttribute('aria-checked', String(settings.musicOn));
    ui.swSfx.setAttribute('aria-checked', String(settings.sfxOn));
    ui.volMusic.value = Math.round(settings.musicVol * 100);
    ui.volSfx.value = Math.round(settings.sfxVol * 100);
    ui.volMusic.disabled = !settings.musicOn;
    ui.volSfx.disabled = !settings.sfxOn;
  }
  function changed() { applyVolumes(); renderSettings(); saveSettings(); }
  ui.btnSettings.addEventListener('click', function () { SND.play('button'); renderSettings(); ui.settings.classList.remove('hidden'); });
  ui.btnCloseSettings.addEventListener('click', function () { SND.play('button'); ui.settings.classList.add('hidden'); });
  ui.settings.addEventListener('pointerdown', function (e) { if (e.target === ui.settings) ui.settings.classList.add('hidden'); });
  ui.swMusic.addEventListener('click', function () { settings.musicOn = !settings.musicOn; changed(); SND.play('button'); });
  ui.swSfx.addEventListener('click', function () { settings.sfxOn = !settings.sfxOn; changed(); SND.play('button'); });
  ui.volMusic.addEventListener('input', function () { settings.musicVol = ui.volMusic.value / 100; applyVolumes(); });
  ui.volSfx.addEventListener('input', function () { settings.sfxVol = ui.volSfx.value / 100; applyVolumes(); });
  ui.volMusic.addEventListener('change', changed);
  ui.volSfx.addEventListener('change', function () { changed(); SND.play('drop'); });
  renderSettings();

  // read-only hook for automated tests
  window.OSProto = {
    debug: function () {
      return { audio: { state: actx ? actx.state : 'none', music: !!musicSrc, loaded: Object.keys(buffers).length,
          played: sndStats.played, errors: sndStats.errors, last: sndStats.last, musicGain: musicGain ? musicGain.gain.value : null,
          sfxGain: sfxGain ? sfxGain.gain.value : null }, settings: settings, hand: ui.hand.classList.contains('hidden') ? null : handPoint(),
        progress: progress, level: G.index + 1, moves: G.moves, won: G.won, cap: G.cap, boxes: colorState(),
        rects: layout.boxes.map(function (B) { return { x: B.x, y: B.y, w: B.w, h: B.h }; }) };
    }
  };

  startLevel(clamp(progress.last, 0, LEVELS.length - 1));
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
